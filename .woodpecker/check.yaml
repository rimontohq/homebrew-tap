# The formula's checks: every pull request, every push to dev, and every night (the Woodpecker cron "nightly"), so a
# download that went away, a new Homebrew rule or an npm release without its formula shows up by itself.
# Runs on the runner VM, like every check (rm-infra: ops/runner/README.md).
labels:
  pool: runner

when:
  - event: pull_request
  - event: push
    branch: dev
  - event: cron
    cron: nightly
  - event: manual

steps:
  # Homebrew's own image (Linux): audit the formula, install it with its node, run its test, run the command.
  - name: formula
    image: homebrew/brew:latest
    commands:
      - brew update --quiet > /dev/null
      - brew tap rimontohq/tap "$${CI_WORKSPACE}"
      # Homebrew loads a formula of another tap only once it is trusted (docs.brew.sh/Tap-Trust). People installing
      # with the full name `brew install rimontohq/tap/rimonto` trust it by that; the audit comes first here.
      - brew trust --formula rimontohq/tap/rimonto
      - brew audit --strict --online --formula rimontohq/tap/rimonto
      - brew install --formula rimontohq/tap/rimonto
      - brew test rimontohq/tap/rimonto
      - rimonto --version

  # npm and the formula offer the same version, and the package on npm runs.
  - name: npm
    image: rimonto-ci:local
    commands:
      - |
        FORMULA=$$(sed -nE 's|.*/download/v([0-9][^/]*)/.*|\1|p' Formula/rimonto.rb)
        # npm's registry answers from a cache for a few minutes after a release: ask past it.
        NPM=$$(curl -fsS -H "Cache-Control: no-cache" "https://registry.npmjs.org/rimonto/latest?t=$$(date +%s)" | node -p "JSON.parse(require(\"fs\").readFileSync(0, \"utf8\")).version")
        echo "the formula offers $$FORMULA, npm $$NPM"
        if [ "$$FORMULA" != "$$NPM" ]; then echo "The formula and npm disagree. A release goes to both (README)."; exit 1; fi
        npx -y "rimonto@$$NPM" --version | tee /dev/stderr | grep -q "^rimonto $$NPM "

  # The pipelines linted with woodpecker-cli lint --strict (and a shell script or a Dockerfile with shellcheck or hadolint,
  # once there is one), as in every Rimonto repository (scripts/lint-ops.mjs), and its own tests. A warning fails.
  - name: lint
    image: rimonto-ci:local
    commands:
      - node scripts/lint-ops.mjs
      - node --test scripts/lint-ops.test.mjs

  # Secrets in the commits this branch adds (scripts/gitleaks.mjs, .gitleaks.toml).
  - name: secrets
    image: rimonto-ci:local
    commands: [node scripts/gitleaks.mjs branch]
